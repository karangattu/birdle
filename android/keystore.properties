# Signing config for the sideloadable release APK.
#
# This is a SELF-SIGNED, PUBLICLY COMMITTED key. That is intentional: Birdle is
# distributed as a sideloaded APK, never on the Play Store, so the key's only job
# is to stay identical forever so tablets can upgrade in place. Anyone can forge
# another APK with the same signature -- there is nothing behind it to protect.
#
# DO NOT regenerate or "rotate" this key: installs signed with a different key
# cannot replace an existing install, so users would have to uninstall first.
storeFile=birdle-release.keystore
storePassword=3cjz0iflvPrLPDfQXyfs0NQdatiE
keyAlias=birdle
keyPassword=3cjz0iflvPrLPDfQXyfs0NQdatiE
