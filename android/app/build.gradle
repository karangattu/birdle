plugins {
    id 'com.android.application'
}

// Release signing. The key is a committed, self-signed keystore -- see
// keystore.properties for why that is deliberate. Optional -P overrides let a
// maintainer sign a build with their own key without editing this file.
def keystorePropsFile = rootProject.file('keystore.properties')
def keystoreProps = new Properties()
if (keystorePropsFile.exists()) {
    keystorePropsFile.withInputStream { keystoreProps.load(it) }
}
def storeFileProp = project.findProperty('BIRDLE_STORE_FILE') ?: keystoreProps['storeFile']
def signingConfigured = storeFileProp && rootProject.file(storeFileProp).exists()
def versionCodeOverride = project.findProperty('birdleVersionCode')
def versionNameOverride = project.findProperty('birdleVersionName')

android {
    namespace 'org.sfbbo.birdle'
    compileSdk 35

    defaultConfig {
        applicationId 'org.sfbbo.birdle'
        minSdk 24
        targetSdk 35
        // CI derives both from the release tag (-PbirdleVersionName/-PbirdleVersionCode)
        // so the tag and the installed app can never disagree. Local builds fall back
        // to the values below.
        versionCode (versionCodeOverride != null ? versionCodeOverride.toInteger() : 1)
        versionName (versionNameOverride ?: '1.0.0-dev')
    }

    signingConfigs {
        release {
            if (signingConfigured) {
                storeFile rootProject.file(storeFileProp)
                storePassword (project.findProperty('BIRDLE_STORE_PASSWORD') ?: keystoreProps['storePassword'])
                keyAlias (project.findProperty('BIRDLE_KEY_ALIAS') ?: keystoreProps['keyAlias'])
                keyPassword (project.findProperty('BIRDLE_KEY_PASSWORD') ?: keystoreProps['keyPassword'])
            }
        }
    }

    buildTypes {
        debug {
            applicationIdSuffix '.debug'
            versionNameSuffix '-debug'
        }
        release {
            // Nothing to shrink: one Activity, no third-party dependencies, and the
            // whole game ships as bundled WebView assets that R8 cannot touch anyway.
            minifyEnabled false
            if (signingConfigured) {
                signingConfig signingConfigs.release
            }
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
}
